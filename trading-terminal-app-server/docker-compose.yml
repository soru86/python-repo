version: '3.8'

services:
  trading-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
      - REDIS_URL=redis://redis:6379/0
      - RATE_LIMIT_STORAGE_URL=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-this}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - SENTRY_DSN=${SENTRY_DSN}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - trading-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - trading-network

  # Algorithmic Trading Strategy Containers
  strategy-manager:
    build: .
    image: trading-strategy-manager
    container_name: strategy-manager
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAX_CONTAINERS=10
      - HEALTH_CHECK_INTERVAL=30
      - AUTO_RESTART_FAILED=true
    depends_on:
      - redis
      - trading-api
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - strategy_data:/app/data
    networks:
      - trading-network
    command: ["python", "-m", "algo.strategy_manager"]

  # Example Strategy Containers (can be scaled dynamically)
  moving-average-strategy:
    build: .
    image: trading-strategy
    container_name: ma-strategy-1
    environment:
      - STRATEGY_NAME=moving_average_btc
      - STRATEGY_TYPE=moving_average
      - SYMBOLS=["BTCUSDT", "ETHUSDT"]
      - EXCHANGE=binance
      - PARAMETERS={"fast_period": 10, "slow_period": 20, "min_trend_strength": 0.1}
      - RISK_MANAGEMENT={"stop_loss_pct": 0.02, "take_profit_pct": 0.05}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - trading-network
    command: ["python", "-m", "algo.strategy_runner"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  rsi-strategy:
    build: .
    image: trading-strategy
    container_name: rsi-strategy-1
    environment:
      - STRATEGY_NAME=rsi_btc
      - STRATEGY_TYPE=rsi
      - SYMBOLS=["BTCUSDT"]
      - EXCHANGE=binance
      - PARAMETERS={"rsi_period": 14, "oversold_level": 30, "overbought_level": 70}
      - RISK_MANAGEMENT={"stop_loss_pct": 0.02, "take_profit_pct": 0.05}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - trading-network
    command: ["python", "-m", "algo.strategy_runner"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  macd-strategy:
    build: .
    image: trading-strategy
    container_name: macd-strategy-1
    environment:
      - STRATEGY_NAME=macd_btc
      - STRATEGY_TYPE=macd
      - SYMBOLS=["BTCUSDT"]
      - EXCHANGE=binance
      - PARAMETERS={"fast_period": 12, "slow_period": 26, "signal_period": 9}
      - RISK_MANAGEMENT={"stop_loss_pct": 0.02, "take_profit_pct": 0.05}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - trading-network
    command: ["python", "-m", "algo.strategy_runner"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  bollinger-bands-strategy:
    build: .
    image: trading-strategy
    container_name: bb-strategy-1
    environment:
      - STRATEGY_NAME=bollinger_btc
      - STRATEGY_TYPE=bollinger_bands
      - SYMBOLS=["BTCUSDT"]
      - EXCHANGE=binance
      - PARAMETERS={"period": 20, "std_dev": 2, "squeeze_threshold": 0.1}
      - RISK_MANAGEMENT={"stop_loss_pct": 0.02, "take_profit_pct": 0.05}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - trading-network
    command: ["python", "-m", "algo.strategy_runner"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

networks:
  trading-network:
    driver: bridge
    labels:
      trading: "strategy-network"

volumes:
  redis_data:
  strategy_data: 